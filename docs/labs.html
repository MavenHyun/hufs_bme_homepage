<style>
/* ============================================================
   CSS VARIABLES & RESET
   ============================================================ */
:root {
  --hufs-green: #146E7A;
  --hufs-navy: #002D56;
  --hufs-gold: #8D7150;
  --hufs-gray: #DADAD3;
  --hufs-silver: #9D9FA2;
  --bg: #F5F5F2;
  --card-bg: #FFFFFF;
  --text-primary: #1A1A1A;
  --text-secondary: #555555;
  --text-muted: #888888;
  --border: #E0E0DC;
  --row-hover: #F8F8F6;
}

[data-theme="dark"] {
  --bg: #121820;
  --card-bg: #1A2332;
  --text-primary: #E8E8E4;
  --text-secondary: #A8A8A4;
  --text-muted: #707070;
  --border: #2A3444;
  --row-hover: #1E2A3A;
  --hufs-gray: #3A3A44;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

body.embed {
  background: transparent;
}

/* ============================================================
   HEADER
   ============================================================ */
.page-header {
  background: var(--hufs-navy);
  color: #FFFFFF;
  padding: 28px 32px;
  position: sticky;
  top: 0;
  z-index: 100;
}

body.embed .page-header {
  position: relative;
}

.header-inner {
  /* no max-width — stretches with viewport, matching card width */
}

.header-title h1 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.3px;
}

.header-title .subtitle {
  font-size: 12px;
  font-weight: 300;
  opacity: 0.75;
  margin-top: 2px;
}

/* ============================================================
   MAIN LAYOUT
   ============================================================ */
.main-content {
  padding: 24px 32px 48px;
}

/* ============================================================
   LAB CARD
   ============================================================ */
.lab-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 20px;
  display: flex;
  flex-direction: column;
  transition: box-shadow 0.2s;
}

.lab-card:hover {
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
}

[data-theme="dark"] .lab-card:hover {
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
}

/* ---- Image area (top) ---- */
.lab-image {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--row-hover);
  border-bottom: 1px solid var(--border);
}

.lab-image svg {
  width: 100%;
  height: 100%;
}

/* ---- Info column ---- */
.lab-info {
  flex: 1;
  padding: 24px 28px;
  min-width: 0;
}

.lab-name {
  font-size: 18px;
  font-weight: 700;
  color: var(--hufs-navy);
  margin-bottom: 2px;
}

[data-theme="dark"] .lab-name {
  color: #8BC4E8;
}

.lab-name-en {
  font-size: 12px;
  font-weight: 400;
  color: var(--text-muted);
  margin-bottom: 12px;
}

.pi-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(20, 110, 122, 0.08);
  border: 1px solid rgba(20, 110, 122, 0.18);
  border-radius: 6px;
  padding: 4px 12px;
  font-size: 13px;
  font-weight: 600;
  color: var(--hufs-green);
  margin-bottom: 14px;
}

[data-theme="dark"] .pi-badge {
  background: rgba(20, 110, 122, 0.15);
  border-color: rgba(20, 110, 122, 0.3);
  color: #3ABBC8;
}

.pi-badge .position {
  font-size: 11px;
  font-weight: 400;
  color: var(--text-muted);
}

.lab-description {
  font-size: 13.5px;
  color: var(--text-secondary);
  line-height: 1.7;
  margin-bottom: 18px;
}

/* ---- Contact grid ---- */
.contact-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 16px;
}

.contact-item {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  font-size: 12.5px;
}

.contact-icon {
  flex-shrink: 0;
  width: 14px;
  height: 14px;
  margin-top: 2px;
  color: var(--hufs-silver);
}

.contact-icon svg {
  width: 14px;
  height: 14px;
  fill: currentColor;
}

.contact-label {
  flex-shrink: 0;
  width: 52px;
  font-weight: 600;
  color: var(--hufs-silver);
  letter-spacing: 0.2px;
}

.contact-item.full-width {
  grid-column: 1 / -1;
}

.contact-value {
  color: var(--text-primary);
  word-break: break-all;
}

.contact-value a {
  color: var(--hufs-green);
  text-decoration: none;
  transition: opacity 0.15s;
}

.contact-value a:hover {
  opacity: 0.75;
}

/* ============================================================
   FOOTER
   ============================================================ */
.page-footer {
  text-align: center;
  padding: 16px;
  font-size: 11px;
  color: var(--text-muted);
}

.page-footer a {
  color: var(--hufs-green);
  text-decoration: none;
}

body.embed .page-footer {
  display: none;
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 768px) {
  .page-header {
    padding: 20px 16px;
  }

  .lab-info {
    padding: 20px;
  }

  .contact-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 480px) {
  .header-title h1 {
    font-size: 16px;
  }

  .lab-name {
    font-size: 16px;
  }

  .lab-image {
    min-height: 160px;
  }

  .lab-info {
    padding: 16px;
  }

  .lab-description {
    font-size: 13px;
  }
}

/* ============================================================
   PRINT
   ============================================================ */
@media print {
  .page-header {
    position: relative;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .lab-card {
    break-inside: avoid;
  }
}
</style>
</head>

function renderLab(lab) {

        ${icon('homepage')}<span class="contact-label">홈페이지</span>

      </div>`
    : `<div class="contact-item">
        ${icon('homepage')}<span class="contact-label">홈페이지</span>
        <span class="contact-value" style="color:var(--text-muted);">미정</span>
      </div>`;

  const topicsRow = lab.topics
    ? `<div class="contact-item full-width">
        ${icon('topics')}<span class="contact-label">연구주제</span>
        <span class="contact-value">${escapeHtml(lab.topics)}</span>
      </div>`
    : '';

    ? `<div class="contact-item">
        ${icon('orcid')}<span class="contact-label">ORCID</span>
        <span class="contact-value"><a href="${escapeHtml(lab.orcid)}" target="_blank" rel="noopener">${escapeHtml(lab.orcid.replace('https://orcid.org/', ''))}</a></span>
      </div>`
    : '';

  const scholarRow = lab.scholar
    ? `<div class="contact-item">
        ${icon('scholar')}<span class="contact-label">논문실적</span>
        <span class="contact-value"><a href="${escapeHtml(lab.scholar)}" target="_blank" rel="noopener">Google Scholar</a></span>
      </div>`
    : '';

  const githubRow = lab.github
    ? `<div class="contact-item">
        ${icon('github')}<span class="contact-label">깃허브</span>
        <span class="contact-value"><a href="${escapeHtml(lab.github)}" target="_blank" rel="noopener">${escapeHtml(lab.github.replace('https://github.com/', ''))}</a></span>
      </div>`
    : '';

  const imageContent = lab.photo
    ? `<img src="${escapeHtml(lab.photo)}" alt="${escapeHtml(lab.labName)}" style="width:100%;height:100%;object-fit:contain;">`
    : placeholderSVG();

  return `<section class="lab-card">
    <div class="lab-image">
      ${imageContent}
    </div>
    <div class="lab-info">
      <h2 class="lab-name">${escapeHtml(lab.labName)}</h2>
      <div class="lab-name-en">${escapeHtml(lab.labNameEn)}</div>
      <div class="pi-badge">
        ${escapeHtml(lab.piName)} (${escapeHtml(lab.piNameEn)})
        <span class="position">${escapeHtml(lab.position)}</span>
      </div>
      <p class="lab-description">${escapeHtml(lab.description)}</p>
      <div class="contact-grid">
        <div class="contact-item">
          ${icon('email')}<span class="contact-label">이메일</span>
          <span class="contact-value"><a href="mailto:${escapeHtml(lab.email)}">${escapeHtml(lab.email)}</a></span>
        </div>
        <div class="contact-item">
          ${icon('phone')}<span class="contact-label">전화</span>
          <span class="contact-value"><a href="tel:${escapeHtml(lab.phone)}">${escapeHtml(lab.phone)}</a></span>
        </div>
        <div class="contact-item">
          ${icon('office')}<span class="contact-label">연구실</span>
          <span class="contact-value">${escapeHtml(lab.office)}</span>
        </div>
        <div class="contact-item">
          ${icon('lab')}<span class="contact-label">실험실</span>
          <span class="contact-value">${escapeHtml(lab.labLocation)}</span>
        </div>
        ${homepageRow}
        ${scholarRow}
        ${orcidRow}
        ${githubRow}
        ${topicsRow}
      </div>
    </div>
  </section>`;
}

function render() {
  const main = document.getElementById('main-content');
  main.innerHTML = LABS.map(renderLab).join('');
}

// ============================================================
// QUERY PARAMS: ?embed=true, ?theme=dark
// ============================================================
(function init() {
  const params = new URLSearchParams(window.location.search);

  if (params.get('embed') === 'true' || window.parent !== window) {
    document.body.classList.add('embed');
  }

  if (params.get('theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }

  render();
})();
</script>
</body>
</html>
